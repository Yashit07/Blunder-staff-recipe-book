name: Supabase Keep-Alive

# Pings the Supabase project every 3 days so the free-tier project never
# enters the "inactive / paused" state (Supabase pauses after ~7 days of no
# database activity).
#
# One-time setup (already done by user):
#   GitHub → repo → Settings → Secrets and variables → Actions → New secret
#     1) SUPABASE_URL        e.g. https://xxxxxxxxxxxx.supabase.co
#     2) SUPABASE_ANON_KEY   the anon public key (eyJ...)
#
# You can also click "Run workflow" on the Actions tab to test it manually.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET blunder_state (id only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi

          # Strip any trailing slash to keep the URL clean.
          BASE="${SUPABASE_URL%/}"
          ENDPOINT="${BASE}/rest/v1/blunder_state?select=id"

          echo "Pinging: ${ENDPOINT}"

          # --globoff disables curl's [..] and {..} URL globbing, which is the
          # cause of "bad range in URL" errors when any character in the URL
          # is misread as a range.
          HTTP_CODE=$(curl --silent --show-error --globoff \
            --output response.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            "${ENDPOINT}")

          echo "HTTP ${HTTP_CODE}"
          echo "Body:"
          cat response.json || true
          echo

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP ${HTTP_CODE}."
            exit 1
          fi

          echo "Supabase keep-alive ping succeeded."
